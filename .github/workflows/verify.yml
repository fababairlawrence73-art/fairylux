name: Verify fresh setup

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fairylux-admin
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring, dom, fileinfo, curl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: fairylux-admin/package-lock.json
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist
      - run: php artisan key:generate
      - run: composer validate --no-check-publish
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: php artisan test
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fairylux-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: fairylux-mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --runInBand --watch=false
